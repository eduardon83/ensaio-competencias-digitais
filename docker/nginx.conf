# Servidor da imagem Docker: ficheiros estáticos, regresso a index.html (SPA) e os mesmos cabeçalhos de segurança
# de public/_headers (manter os dois iguais).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Sem Worker não há API de textos: a aplicação usa os textos do código.
  location /api/ {
    return 404;
  }

  # Ficheiros com nome versionado: cache longa (o add_header aqui substitui os de cima, por isso repetem-se).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /_headers {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
