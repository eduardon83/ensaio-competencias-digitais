# Release: ao publicar uma tag vX.Y.Z, verifica, gera a aplicação e cria a release no GitHub com:
#   ecd-vX.Y.Z-aplicacao.zip  ficheiros estáticos prontos a alojar (pasta dist/, sem ponto de recolha configurado)
#   ecd-vX.Y.Z-telemetria.zip ponto de recolha (Google Apps Script) e instruções
#   README.pdf e LICENSE
# e publica a imagem Docker em ghcr.io/eduardon83/ensaio-competencias-digitais (etiquetas X.Y.Z, X.Y e latest).
# As notas da release vêm de docs/notas/vX.Y.Z.md, se existir.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Confirmar que a versão da tag é a do package.json
        run: |
          v="${GITHUB_REF_NAME#v}"
          p="$(node -p "require('./package.json').version")"
          test "$v" = "$p" || { echo "A tag ($v) não corresponde ao package.json ($p)"; exit 1; }
      - name: Empacotar
        run: |
          (cd dist && zip -qr "../ecd-${GITHUB_REF_NAME}-aplicacao.zip" .)
          zip -qr "ecd-${GITHUB_REF_NAME}-telemetria.zip" telemetria
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notas="docs/notas/${GITHUB_REF_NAME}.md"
          if [ -f "$notas" ]; then arg=(--notes-file "$notas"); else arg=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" \
            "ecd-${GITHUB_REF_NAME}-aplicacao.zip" \
            "ecd-${GITHUB_REF_NAME}-telemetria.zip" \
            README.pdf LICENSE \
            --title "Ensaio às Competências Digitais ${GITHUB_REF_NAME}" "${arg[@]}"

  imagem:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
